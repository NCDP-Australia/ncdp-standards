# NCDP Data Standards and Procedures: the publish manifest.
#
# The repository holds the working drafts; the GitHub Wiki holds the LOCKED revision,
# regenerated from this file by Scripts/publish_to_wiki.py. One revision applies to
# the whole set (see README "Versioning"): MAJOR.YYx, e.g. 5.01, 5.01a, 5.02.
# The release tag is "v" + revision (v5.01); every GitHub release is archived by
# Zenodo under the concept DOI below and gets its own version DOI.
revision: "5.01a"
revision_date: "2026-10-28"
schema_version: "5.0"            # the metadata record format; changes only with a schema change
concept_doi: "10.5281/zenodo.23127540"
repository: "NCDP-Australia/ncdp-standards"
home_intro: docs/home.md         # the opening of the wiki Home page

# Wiki groups, in this order.
categories:
  - Field procedures
  - Data standards
  - Contributing data
  - Quality assurance
  - Indicators and reports

# status: adopted | provisional | stub
#   adopted     reviewed and locked for this revision
#   provisional in use; parameters may still change in a minor revision (say which in "note")
#   stub        being written
# last_revised: the revision in which the page last changed (not the current revision)
pages:
  - source: docs/field-manual.md
    wiki_page: Field-Manual
    title: NCDP Field Manual
    category: Field procedures
    status: adopted
    last_revised: "5.01"
  - source: docs/data-structure.md
    wiki_page: Data-Structure
    title: Data structure and processing levels
    category: Data standards
    status: adopted
    last_revised: "5.00"
  - source: docs/naming-convention.md
    wiki_page: Naming-Convention
    title: Naming convention
    category: Data standards
    status: adopted
    last_revised: "5.00"
  - source: docs/metadata-schema.md
    wiki_page: Metadata-Schema
    title: Metadata schema (v5.0)
    category: Data standards
    status: adopted
    last_revised: "5.00"
  - source: docs/submitting-data.md
    wiki_page: Submitting-Data
    title: Submitting a survey
    category: Contributing data
    status: adopted
    last_revised: "5.01"
  - source: docs/qaqc-protocol.md
    wiki_page: QAQC-Protocol
    title: QA/QC protocol
    category: Quality assurance
    status: adopted
    last_revised: "5.01"
  - source: docs/indicators.md
    wiki_page: Indicators
    title: Coastal change indicators (L4) and site reports
    category: Indicators and reports
    status: provisional
    last_revised: "5.01"
    note: "Thresholds and the reference-stretch rules may be tuned as more locations are processed."
