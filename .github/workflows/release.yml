name: release
# Push a tag v<revision> (e.g. v5.02) to publish that revision:
#   1. the tag must equal "v" + revision in publish.yaml;
#   2. the pages are published to the wiki (locked-revision banner, Home, sidebar, changelog);
#   3. a PDF of every page is rendered (pandoc + weasyprint);
#   4. the GitHub release is created with the PDFs and the changelog section as notes.
# Zenodo's GitHub integration then archives the release and mints its version DOI.
on:
  push:
    tags: ['v*']
permissions:
  contents: write          # create the release and push to the wiki
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libpango-1.0-0 libpangoft2-1.0-0
          pip install --quiet pyyaml weasyprint
      - name: Tag matches publish.yaml
        run: |
          REV=$(python -c "import yaml; print(yaml.safe_load(open('publish.yaml'))['revision'])")
          test "v$REV" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$REV in publish.yaml"; exit 1; }
          python Scripts/publish_to_wiki.py --check
          echo "REV=$REV" >> "$GITHUB_ENV"
      - name: Publish to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" ../ncdp-standards.wiki
          python Scripts/publish_to_wiki.py --wiki ../ncdp-standards.wiki --pdf
          cd ../ncdp-standards.wiki
          git config user.name "ncdp-release-bot"
          git config user.email "ncdp@deakin.edu.au"
          git add -A
          git diff --cached --quiet || git commit -m "Publish revision ${REV}"
          git push
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re
          rev = os.environ["REV"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## Revision {re.escape(rev)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else f"Revision {rev}.")
          notes += f"\n\nLocked pages: https://github.com/{os.environ['GITHUB_REPOSITORY']}/wiki — PDFs attached."
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" releases/Rev${REV}/*.pdf \
            --title "Revision ${REV}" --notes-file release-notes.md
