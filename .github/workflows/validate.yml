name: validate
on: [push, pull_request]
jobs:
  schema:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from
    # 2026-10-19: the validation environment changes only when we choose.
    runs-on: ubuntu-24.04
    steps:
      # Node 24 majors; v4 / v5 targeted the deprecated Node 20 runtime.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: CSV and JSON schema agree
        run: |
          python - <<'EOF'
          import csv, json
          rows = list(csv.DictReader(open('schema/ncdp-metadata-schema-v3.csv')))
          data = json.load(open('schema/ncdp-metadata-schema-v3.json'))
          assert len(rows) == data['header_count'], 'row count mismatch'
          assert [r['header'] for r in rows] == [f['header'] for f in data['fields']], 'header order mismatch'
          tpl = next(csv.reader(open('templates/L0_metadata_template.csv')))
          assert tpl == [r['header'] for r in rows], 'template headers do not match schema'
          print(f"{len(rows)} fields consistent across csv, json and template")
          EOF
      - name: resources.json is valid
        run: |
          python - <<'EOF'
          import json, re
          d = json.load(open('resources.json'))
          rs = d['resources']
          assert isinstance(rs, list) and rs, 'no resources'
          for r in rs:
              assert r.get('category') and r.get('title'), f'incomplete: {r}'
              if r.get('doi'):
                  doi = r['doi'].replace('https://doi.org/', '')
                  assert re.fullmatch(r'10\.[0-9]{4,9}/[-._;()/:A-Za-z0-9]+', doi), f'bad doi: {doi}'
              if r.get('url'):
                  assert r['url'].startswith(('http://', 'https://')), f"bad url: {r['url']}"
          print(f'{len(rs)} resources valid')
          EOF

